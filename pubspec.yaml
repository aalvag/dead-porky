name: dead_porky
description: "Tu centro de control personal de salud, ejercicio y bienestar. PWA con integración de wearables y asistencia de IA."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # ==================== Firebase ====================
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0
  firebase_crashlytics: ^5.2.0
  firebase_analytics: ^12.3.0

  # ==================== State Management ====================
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # ==================== Navigation ====================
  go_router: ^17.2.3

  # ==================== Local Database ====================
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.1

  # ==================== Dependency Injection ====================
  get_it: ^9.2.1
  injectable: ^2.7.1+4

  # ==================== HTTP & Networking ====================
  dio: ^5.9.2
  http: ^1.6.0

  # ==================== Code Generation Support ====================
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # ==================== BLE / Wearables ====================
  flutter_blue_plus: ^2.2.1

  # ==================== Health APIs ====================
  health: ^13.3.1
  health_connector: ^3.8.1
  health_connector_core: ^3.8.0

  # ==================== AI / Kilo Gateway ====================
  openai_dart: ^4.3.0
  eventflux: ^2.2.1

  # ==================== UI Components ====================
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.9
  flutter_svg: ^2.2.4
  lottie: ^3.3.3
  font_awesome_flutter: ^11.0.0

  # ==================== Security ====================
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.1

  # ==================== Voice Input ====================
  speech_to_text: ^7.3.0

  # ==================== Notifications ====================
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0

  # ==================== Utils ====================
  intl: ^0.20.2
  uuid: ^4.5.3
  dartz: ^0.10.1
  logger: ^2.7.0
  connectivity_plus: ^7.1.1
  flutter_dotenv: ^6.0.1
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  file_picker: ^10.3.2

  # ==================== Export ====================
  pdf: ^3.12.0
  csv: ^8.0.0
  printing: ^5.14.3

  # ==================== Storage ====================
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ==================== Auth Social ====================
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # ==================== Code Generation ====================
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  injectable_generator: ^2.12.1
  drift_dev: ^2.31.0
  riverpod_generator: ^4.0.3

  # ==================== Testing ====================
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  golden_toolkit: ^0.15.0

  # ==================== Linting ====================
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/animations/
    - assets/images/
    - .env

